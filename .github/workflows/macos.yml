name: macOS build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check core behavior
        run: ./scripts/test.sh
      - name: Build signed macOS application
        run: ./scripts/build.sh
      - name: Package installer
        run: ./scripts/package-dmg.sh
